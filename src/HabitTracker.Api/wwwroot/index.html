<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Habit Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Hoy</h1>
    <p id="today"></p>
  </header>
  <main>
    <ul id="habits" aria-live="polite"></ul>
    <p id="empty" hidden>Aún no tienes hábitos. Toca + para crear el primero.</p>
    <p id="error" role="alert" hidden></p>
  </main>
  <button id="add" aria-label="Nuevo hábito">+</button>

  <dialog id="dialog">
    <form method="dialog" id="form">
      <h2>Nuevo hábito</h2>
      <input id="name" name="name" maxlength="100" placeholder="Ej. Beber agua" autocomplete="off" required>
      <div class="actions">
        <button type="button" id="cancel" class="secondary">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
